name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Run lint
        if: matrix.node-version == '26.x'
        run: npm run lint
      - name: Run typecheck
        if: matrix.node-version == '26.x'
        run: npm run typecheck
      - name: Run tests
        if: matrix.node-version != '26.x'
        run: npm test
      - name: Run tests with coverage
        if: matrix.node-version == '26.x'
        run: npm run test:coverage | tee "$RUNNER_TEMP/tests.txt"
      # Reported in its own step so the summary is still written when the suite
      # fails, which is when the test results are most worth reading. Node
      # prints both its summary and the coverage report even on failure.
      - name: Report test results & coverage
        if:
          ${{ !cancelled() && matrix.node-version == '26.x' &&
          hashFiles('coverage/lcov.info') != '' }}
        run: |
          {
            echo '## Tests'
            echo
            echo '```'
            grep -E '^ℹ (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms) ' "$RUNNER_TEMP/tests.txt" | sed 's/^ℹ //'
            echo '```'
            echo
            echo '## Test coverage'
            echo
            echo '```'
            awk '/start of coverage report/{f=1;next} /end of coverage report/{f=0} f' "$RUNNER_TEMP/tests.txt" | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if:
          ${{ !cancelled() && matrix.node-version == '26.x' &&
          hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_attempt }}
          path: coverage/
          retention-days: 14
